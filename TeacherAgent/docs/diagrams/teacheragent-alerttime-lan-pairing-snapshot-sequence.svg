<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2810" viewBox="0 0 2000 2810" role="img" aria-labelledby="title desc">
  <title id="title">TeacherAgent 与 AlertTime 局域网配对与快照同步时序图</title>
  <desc id="desc">展示安全配对、SPKI 指纹锁定、全量快照幂等同步、建议拉取、学生决策与手机端原子写入。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#18324b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#118b85"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2867a7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b56610"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7551a5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16865e"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Segoe UI", "SimSun", sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #172b3a; letter-spacing: .2px; }
      .subtitle { font-size: 13px; fill: #5b6b78; }
      .lane-title { font-size: 16px; font-weight: 700; }
      .lane-sub { font-size: 11px; fill: #526473; }
      .phase-title { font-size: 16px; font-weight: 700; fill: #20384c; }
      .msg { font-size: 13px; font-weight: 650; fill: #20313f; }
      .note { font-size: 11px; fill: #526473; }
      .state-title { font-size: 12px; font-weight: 700; }
      .state { font-size: 11px; fill: #334957; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; }
      .step-card { fill: #ffffff; stroke: #cbd6df; stroke-width: 1.2; }
      .life { stroke-width: 1.7; stroke-dasharray: 8 8; opacity: .62; }
    </style>
  </defs>

  <rect width="2000" height="2810" fill="#f7f9fc"/>
  <rect x="54" y="28" width="1892" height="62" rx="14" fill="#ffffff" stroke="#dbe4ec" filter="url(#shadow)"/>
  <text class="title" x="78" y="58">TeacherAgent × AlertTime 局域网配对与快照同步时序图</text>
  <text class="subtitle" x="78" y="80">安全配对 · SPKI SHA-256 指纹锁定 · 全量快照幂等导入 · 建议游标拉取 · 学生明确决策 · Room 原子写入</text>
  <g transform="translate(1630 46)">
    <rect width="286" height="28" rx="14" fill="#eef4fa" stroke="#c8d9e8"/>
    <text x="143" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#315c7e">私有局域网 HTTPS · 本地优先</text>
  </g>

  <!-- Phase containers -->
  <rect x="50" y="205" width="1900" height="900" rx="16" fill="#ffffff" stroke="#a9c8e7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="50" y="205" width="1900" height="46" rx="16" fill="#e8f1fb"/>
  <rect x="50" y="235" width="1900" height="16" fill="#e8f1fb"/>
  <rect x="50" y="1125" width="1900" height="1495" rx="16" fill="#ffffff" stroke="#9bd4c7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="50" y="1125" width="1900" height="46" rx="16" fill="#e9f7f5"/>
  <rect x="50" y="1155" width="1900" height="16" fill="#e9f7f5"/>

  <!-- Lifelines -->
  <line class="life" x1="260" y1="182" x2="260" y2="2620" stroke="#118b85"/>
  <line class="life" x1="720" y1="182" x2="720" y2="2620" stroke="#2867a7"/>
  <line class="life" x1="1180" y1="182" x2="1180" y2="2620" stroke="#b56610"/>
  <line class="life" x1="1640" y1="182" x2="1640" y2="2620" stroke="#7551a5"/>

  <!-- Participant headers -->
  <g transform="translate(120 106)">
    <rect width="280" height="76" rx="14" fill="#e9f7f5" stroke="#118b85" stroke-width="1.8" filter="url(#shadow)"/>
    <text class="lane-title" x="140" y="31" text-anchor="middle" fill="#0c746f">手机端</text>
    <text class="lane-sub" x="140" y="54" text-anchor="middle">AlertTime / Android / Room</text>
  </g>
  <g transform="translate(580 106)">
    <rect width="280" height="76" rx="14" fill="#e8f1fb" stroke="#2867a7" stroke-width="1.8" filter="url(#shadow)"/>
    <text class="lane-title" x="140" y="31" text-anchor="middle" fill="#245d91">桌面服务</text>
    <text class="lane-sub" x="140" y="54" text-anchor="middle">TeacherAgent / Tauri / Rust</text>
  </g>
  <g transform="translate(1040 106)">
    <rect width="280" height="76" rx="14" fill="#fff5df" stroke="#b56610" stroke-width="1.8" filter="url(#shadow)"/>
    <text class="lane-title" x="140" y="31" text-anchor="middle" fill="#9b5810">证书与安全</text>
    <text class="lane-sub" x="140" y="54" text-anchor="middle">TLS Identity / OS Keyring</text>
  </g>
  <g transform="translate(1500 106)">
    <rect width="280" height="76" rx="14" fill="#f2eafa" stroke="#7551a5" stroke-width="1.8" filter="url(#shadow)"/>
    <text class="lane-title" x="140" y="31" text-anchor="middle" fill="#67478f">学生</text>
    <text class="lane-sub" x="140" y="54" text-anchor="middle">唯一决策主体 / Student</text>
  </g>

  <text class="phase-title" x="76" y="235">阶段一 ｜ 安全配对：服务启动、二维码传递、SPKI 指纹锁定与凭据换发</text>
  <g transform="translate(1664 216)">
    <rect width="258" height="25" rx="12.5" fill="#ffffff" stroke="#b6cde2"/>
    <text x="129" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#2867a7">TLS 1.2+ · 10 分钟一次性 Token</text>
  </g>

  <!-- Step 1 -->
  <rect class="step-card" x="1000" y="268" width="360" height="30" rx="10"/>
  <text class="msg" x="1180" y="288" text-anchor="middle">1. 启动同步服务并创建配对</text>
  <line x1="1640" y1="316" x2="720" y2="316" stroke="#7551a5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="930" y="329" width="500" height="30" rx="10" fill="#f5f7fa" stroke="#d8e0e7"/>
  <text class="note" x="1180" y="349" text-anchor="middle">桌面选择活动私有局域网 IPv4，并在端口 8787 监听 HTTPS</text>

  <!-- Step 2 -->
  <rect class="step-card" x="795" y="370" width="310" height="30" rx="10"/>
  <text class="msg" x="950" y="390" text-anchor="middle">2. 读取或生成自签 TLS 身份</text>
  <line x1="720" y1="418" x2="1180" y2="418" stroke="#2867a7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="792" y="431" width="316" height="30" rx="10" fill="#fff9ed" stroke="#ead0a9"/>
  <text class="note" x="950" y="451" text-anchor="middle">TLS 私钥由操作系统 Keychain / Keyring 隔离保护</text>

  <!-- Step 3 -->
  <rect class="step-card" x="795" y="476" width="310" height="30" rx="10"/>
  <text class="msg" x="950" y="496" text-anchor="middle">3. 返回证书与 SPKI SHA-256 指纹</text>
  <line x1="1180" y1="524" x2="720" y2="524" stroke="#b56610" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <g transform="translate(790 537)">
    <rect width="320" height="54" rx="10" fill="#fff9ed" stroke="#ead0a9"/>
    <text class="note mono" x="160" y="21" text-anchor="middle">pin = SHA-256(SubjectPublicKeyInfo)</text>
    <text class="note" x="160" y="41" text-anchor="middle">可信指纹先随二维码分发，阻止未授权中间人证书</text>
  </g>

  <!-- Step 4 -->
  <rect class="step-card" x="1000" y="610" width="360" height="30" rx="10"/>
  <text class="msg" x="1180" y="630" text-anchor="middle">4. 屏幕渲染配对二维码（ta-sync://v1）</text>
  <line x1="720" y1="658" x2="1640" y2="658" stroke="#2867a7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <g transform="translate(970 671)">
    <rect width="420" height="54" rx="10" fill="#eef4fa" stroke="#c8d9e8"/>
    <text class="note" x="210" y="21" text-anchor="middle">包含 host、port、pin、deviceId</text>
    <text class="note" x="210" y="41" text-anchor="middle">一次性高熵 token：10 分钟有效，成功使用后立即失效</text>
  </g>

  <!-- Step 5 -->
  <rect class="step-card" x="760" y="744" width="380" height="30" rx="10"/>
  <text class="msg" x="950" y="764" text-anchor="middle">5. 使用 AlertTime 相机扫码并解析配对参数</text>
  <line x1="1640" y1="792" x2="260" y2="792" stroke="#7551a5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-purple)"/>
  <g transform="translate(88 811)">
    <rect width="344" height="103" rx="12" fill="#e9f7f5" stroke="#118b85" stroke-width="1.6"/>
    <text class="state-title" x="172" y="23" text-anchor="middle" fill="#0c746f">TLS 握手与指纹锁定</text>
    <text class="state" x="172" y="45" text-anchor="middle">严格比较服务端证书 SPKI SHA-256</text>
    <text class="state" x="172" y="63" text-anchor="middle">与二维码中携带的 pin</text>
    <text x="172" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#a04135">指纹不匹配立即终止；不得接受任意自签证书</text>
  </g>

  <!-- Step 6 -->
  <rect class="step-card" x="350" y="930" width="280" height="30" rx="10"/>
  <text class="msg" x="490" y="950" text-anchor="middle">6. POST /v1/pair（token, deviceId）</text>
  <line x1="260" y1="978" x2="720" y2="978" stroke="#118b85" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <g transform="translate(306 990)">
    <rect width="368" height="54" rx="10" fill="#edf8f6" stroke="#b9ded8"/>
    <text class="note" x="184" y="21" text-anchor="middle">请求位于已完成 SPKI 锁定的 HTTPS 通道</text>
    <text class="note" x="184" y="41" text-anchor="middle">服务端校验 token hash、有效期与设备绑定状态</text>
  </g>

  <!-- Step 7 -->
  <rect x="357" y="1052" width="266" height="30" rx="15" fill="#e9f7f0" stroke="#8ecab5"/>
  <text x="490" y="1072" text-anchor="middle" font-size="13" font-weight="700" fill="#16865e">7. pairAck · 下发长期 Bearer 凭据</text>
  <line x1="720" y1="1092" x2="260" y2="1092" stroke="#16865e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <text class="phase-title" x="76" y="1155">阶段二 ｜ 协同闭环：全量快照上报、建议游标拉取、学生决策与原子写入</text>
  <g transform="translate(1640 1136)">
    <rect width="282" height="25" rx="12.5" fill="#ffffff" stroke="#b7dcd3"/>
    <text x="141" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#118b85">Bearer 鉴权 · snapshotId 幂等 · keyset cursor</text>
  </g>

  <g transform="translate(88 1186)">
    <rect width="344" height="75" rx="12" fill="#edf8f6" stroke="#8ecab5" stroke-width="1.5"/>
    <text class="state-title" x="172" y="23" text-anchor="middle" fill="#0c746f">长期凭据本地持久化</text>
    <text class="state" x="172" y="45" text-anchor="middle">Bearer 凭据存入 Android Keystore</text>
    <text class="state" x="172" y="63" text-anchor="middle">后续同步请求统一携带 Bearer 认证</text>
  </g>

  <!-- Step 8 -->
  <g transform="translate(88 1280)">
    <rect width="344" height="94" rx="12" fill="#e9f7f5" stroke="#118b85" stroke-width="1.6"/>
    <text class="state-title" x="172" y="23" text-anchor="middle" fill="#0c746f">Room 一致性快照导出</text>
    <text class="state" x="172" y="45" text-anchor="middle">开启只读事务</text>
    <text class="state" x="172" y="64" text-anchor="middle">原子导出：科目 / 周目标 / 每日任务</text>
    <text class="state" x="172" y="82" text-anchor="middle">专注会话 / 执行状态 / 学习时长分析</text>
  </g>
  <rect class="step-card" x="356" y="1390" width="268" height="30" rx="10"/>
  <text class="msg" x="490" y="1410" text-anchor="middle">8. POST /v1/snapshots</text>
  <line x1="260" y1="1438" x2="720" y2="1438" stroke="#118b85" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="316" y="1451" width="348" height="30" rx="10" fill="#edf8f6" stroke="#b9ded8"/>
  <text class="note mono" x="490" y="1471" text-anchor="middle">Bearer Token · unique snapshotId · JSON DTO</text>

  <!-- Step 9 -->
  <g transform="translate(548 1495)">
    <rect width="344" height="84" rx="12" fill="#e8f1fb" stroke="#2867a7" stroke-width="1.6"/>
    <text class="state-title" x="172" y="23" text-anchor="middle" fill="#245d91">SQLite 幂等事务校验</text>
    <text class="state" x="172" y="45" text-anchor="middle">校验 DTO、外键与 messageType</text>
    <text class="state" x="172" y="63" text-anchor="middle">按 snapshotId 检测重放，避免网络重试重复写入</text>
  </g>
  <rect x="360" y="1597" width="260" height="30" rx="15" fill="#e9f7f0" stroke="#8ecab5"/>
  <text x="490" y="1617" text-anchor="middle" font-size="13" font-weight="700" fill="#16865e">9. snapshotAck</text>
  <line x1="720" y1="1645" x2="260" y2="1645" stroke="#16865e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="292" y="1657" width="396" height="30" rx="10" fill="#eff9f5" stroke="#b8dccf"/>
  <text class="note" x="490" y="1677" text-anchor="middle">回显相同 snapshotId，手机据此关联请求与确认</text>

  <!-- Step 10 -->
  <rect class="step-card" x="720" y="1703" width="494" height="32" rx="10"/>
  <text class="msg" x="967" y="1724" text-anchor="middle">10. 学生在桌面 UI 点击生成；proposalPlanner 构建建议稿</text>
  <path d="M720 1751 H1005 Q1025 1751 1025 1771 V1800 Q1025 1820 1005 1820 H720" fill="none" stroke="#b56610" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="772" y="1763" width="205" height="44" rx="10" fill="#fff9ed" stroke="#ead0a9"/>
    <text class="note" x="874" y="1781" text-anchor="middle">纯规则同步生成并校验诊断证据</text>
    <text class="note" x="874" y="1799" text-anchor="middle">随后经 Tauri command 写入 SQLite</text>
  <g transform="translate(820 1838)">
    <rect width="720" height="74" rx="12" fill="#fff5df" stroke="#b56610" stroke-width="1.8"/>
    <text class="state-title" x="360" y="25" text-anchor="middle" fill="#9b5810">安全边界：TeacherAgent 只生成并保存建议稿</text>
    <text class="state" x="360" y="48" text-anchor="middle">不得直接修改 AlertTime 的周目标、任务或日程数据库；手机端 Room 仍是计划与执行数据的唯一权威来源</text>
  </g>

  <!-- Step 11 -->
  <rect class="step-card" x="338" y="1930" width="304" height="30" rx="10"/>
  <text class="msg" x="490" y="1950" text-anchor="middle">11. GET /v1/proposals?cursor=…</text>
  <line x1="260" y1="1978" x2="720" y2="1978" stroke="#118b85" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="330" y="1990" width="320" height="28" rx="10" fill="#f5f7fa" stroke="#d8e0e7"/>
  <text class="note" x="490" y="2009" text-anchor="middle">基于稳定 keyset cursor 增量分页</text>

  <!-- Step 12 -->
  <rect x="334" y="2031" width="312" height="30" rx="15" fill="#fff5df" stroke="#e0b26f"/>
  <text x="490" y="2051" text-anchor="middle" font-size="13" font-weight="700" fill="#b56610">12. 返回 proposals 与 nextCursor</text>
  <line x1="720" y1="2079" x2="260" y2="2079" stroke="#b56610" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <g transform="translate(306 2091)">
    <rect width="368" height="48" rx="10" fill="#fff9ed" stroke="#ead0a9"/>
    <text class="note" x="184" y="19" text-anchor="middle">仅返回当前配对设备可见的建议</text>
    <text class="note" x="184" y="38" text-anchor="middle">可含新增目标、时间调整及复习任务建议</text>
  </g>

  <!-- Step 13: explicit human decision zone -->
  <rect x="82" y="2156" width="1836" height="250" rx="14" fill="#fbf8fe" stroke="#c5addf" stroke-width="1.6"/>
  <text x="106" y="2181" font-size="12" font-weight="700" fill="#7551a5">学生决策区｜系统仅展示建议，采纳或拒绝必须由学生明确操作</text>
  <rect class="step-card" x="725" y="2192" width="450" height="30" rx="10"/>
  <text class="msg" x="950" y="2212" text-anchor="middle">13a. UI 展示建议内容、理由与影响范围</text>
  <line x1="260" y1="2240" x2="1640" y2="2240" stroke="#b56610" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-orange)"/>
  <rect class="step-card" x="725" y="2250" width="450" height="30" rx="10"/>
  <text class="msg" x="950" y="2270" text-anchor="middle">13b. 明确选择「采纳」或「拒绝」</text>
  <line x1="1640" y1="2298" x2="260" y2="2298" stroke="#7551a5" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-purple)"/>
  <g transform="translate(96 2318)">
    <rect width="328" height="78" rx="12" fill="#e9f7f5" stroke="#118b85" stroke-width="1.6"/>
    <text class="state-title" x="164" y="22" text-anchor="middle" fill="#0c746f">采纳后：本地事务执行</text>
    <text class="state" x="164" y="43" text-anchor="middle">仅当学生主动选择“采纳”时</text>
    <text class="state" x="164" y="61" text-anchor="middle">单个 Room 事务原子创建周目标与任务项</text>
  </g>

  <!-- Step 14 and 15 compact closure -->
  <rect class="step-card" x="332" y="2422" width="316" height="30" rx="10"/>
  <text class="msg" x="490" y="2442" text-anchor="middle">14. POST /v1/proposal-decisions</text>
  <line x1="260" y1="2470" x2="720" y2="2470" stroke="#118b85" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text class="note mono" x="490" y="2494" text-anchor="middle">proposalId · decision = accepted | rejected</text>

  <rect x="360" y="2512" width="260" height="30" rx="15" fill="#e9f7f0" stroke="#8ecab5"/>
  <text x="490" y="2532" text-anchor="middle" font-size="13" font-weight="700" fill="#16865e">15. decisionAck</text>
  <line x1="720" y1="2560" x2="260" y2="2560" stroke="#16865e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="note" x="490" y="2584" text-anchor="middle">桌面归档建议状态，本轮同步闭环完成</text>

  <!-- Bottom security summary -->
  <g transform="translate(50 2660)">
    <rect width="1900" height="110" rx="14" fill="#263846" filter="url(#shadow)"/>
    <text x="24" y="30" font-size="12" font-weight="700" fill="#9bd9cf">全流程安全约束</text>
    <text x="24" y="56" font-size="11" fill="#eef4f7">一次性配对 Token 仅保留必要内存状态与 Hash；通信证书通过 SPKI 指纹锁定验证服务端身份；</text>
    <text x="24" y="80" font-size="11" fill="#eef4f7">长期设备凭据由 Android Keystore 保护；快照以唯一 snapshotId 保证幂等；双端数据权威严格隔离；</text>
    <text x="24" y="104" font-size="11" fill="#eef4f7">所有建议必须由学生主动确认后，才能在手机端单个 Room 事务中转化为真实计划。</text>
  </g>
</svg>
