[project]
name = "document-worker"
version = "0.1.0"
description = "TeacherAgent local document parser and math worker"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
