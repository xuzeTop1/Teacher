[package]
name = "teacher-agent"
version = "0.1.0"
description = "TeacherAgent desktop tutoring assistant"
authors = ["TeacherAgent Contributors"]
edition = "2021"

[lib]
name = "teacher_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# sqlite-vec 暂不可用：0.1.10-alpha.4 在 Windows 编译失败（缺少 sqlite-vec-diskann.c）
# 后续版本修复后可重新启用。当前使用 brute-force cosine similarity。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
keyring = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
rfd = "0.15"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
axum = "0.7"
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"
x509-parser = "0.16"
base64 = "0.22"
rustls-pemfile = "2"
subtle = "2"
hyper = { version = "1", features = ["server", "http1"] }
tower = "0.5"
local-ip-address = "0.6"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[profile.release]
# Size-optimized: the app is I/O bound (network + SQLite), not CPU bound.
# Brute-force cosine over ~1500 vectors is negligible vs. embedding API latency.
opt-level = "z"
lto = true
codegen-units = 1
# Keep panic="unwind" (default): Tauri 2.x IPC uses catch_unwind internally.
# panic="abort" would turn recoverable IPC/command errors into process crashes,
# breaking sidecar lifecycle and error boundaries.
strip = "symbols"
